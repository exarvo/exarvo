<svg xmlns="http://www.w3.org/2000/svg" width="840" height="80" viewBox="0 0 840 80">
<style>@font-face{font-family:bold;src:url(data:font/woff2;base64,)}
.bold{font-family:bold,monospace}.mono{font-family:mono,monospace}
.rv{opacity:0;animation:on .01s forwards}
.cur{fill:#F59E0B;opacity:0}
@keyframes on{to{opacity:1}}
@keyframes gone{to{opacity:0}}
@keyframes pulse{50%{opacity:.25}}
@keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}
@keyframes spin{to{transform:rotate(360deg)}}
</style>
<defs>
<pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
<circle cx="10" cy="10" r=".8" fill="#EDEDED" fill-opacity=".07"/>
</pattern>
</defs>
<rect width="840" height="80" fill="#0A0A0A"/>
<rect width="840" height="80" fill="url(#grid)"/>
<text x="40.0" y="42.0" class="bold" font-size="20.0" fill="#F59E0B">$</text><text x="66.0" y="42.0" class="bold" font-size="20.0" fill="#EDEDED">tail -n 3 writing.log</text><path d="M40 54h56" stroke="#F59E0B" stroke-width="2"/>
</svg>
