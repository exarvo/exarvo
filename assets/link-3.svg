<svg xmlns="http://www.w3.org/2000/svg" width="210" height="80" viewBox="0 0 210 80">
<style>@font-face{font-family:bold;src:url(data:font/woff2;base64,)}
.bold{font-family:bold,monospace}.mono{font-family:mono,monospace}
.rv{opacity:0;animation:on .01s forwards}
.cur{fill:#F59E0B;opacity:0}
.bl{animation:blink 1.2s linear infinite}
@keyframes on{to{opacity:1}}
@keyframes gone{to{opacity:0}}
@keyframes pulse{50%{opacity:.25}}
@keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}
@keyframes spin{to{transform:rotate(360deg)}}
</style>
<defs>
<pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
<circle cx="10" cy="10" r=".8" fill="#EDEDED" fill-opacity=".07"/>
</pattern>
</defs>
<rect width="210" height="80" fill="#0A0A0A"/>

<rect x="30.0" y="20" width="150" height="40" rx="6" fill="#111113" stroke="#2A2A2E"/>
<rect x="30.0" y="20" width="4" height="40" rx="2" fill="#F59E0B"/>
<text x="107.0" y="45.0" class="bold" font-size="14.0" fill="#EDEDED" text-anchor="middle" letter-spacing="1">BLOG</text>
</svg>
